[workspace]
members = [
  "crates/anticheat-model",
  "crates/anticheat-core",
  "crates/anticheat-rules",
  "crates/anticheat-storage",
  "crates/anticheat-protocol",
  "crates/anticheat-ffi",
  "crates/anticheat-cli",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["serde", "v4"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
dashmap = "6"
sha2 = "0.10"
hex = "0.4"
proptest = "1"
axum = "0.7"
tower = "0.4"

[profile.release]
lto = true
codegen-units = 1
